# 推送 <包目录名>@<版本> 形式的 tag 时发布 packages/<包目录名>, 例: easy-np@0.0.5
# npm 包: 登录走 Trusted Publishing(OIDC), 不需要 NPM_TOKEN; 需先在 npmjs.com 的包设置里登记本仓库与 release.yml
# VS Code 插件(package.json 有 engines.vscode): 打包 vsix, 用仓库 Secrets 的 VSCE_PAT 发布到 VS Code Marketplace(必需),
# 配了 OVSX_PAT 时同时发布到 Open VSX, 两个市场发布的是同一个 vsix, 并附到 GitHub Release
# 各 job 拿最小权限: build 执行依赖代码但只有只读权限, 发布 job 不执行依赖代码, release 只写 GitHub Release
# 包内任何文件含 RELEASE-BLOCKER 标记时拒绝发布(例: 许可证文件在取得发布授权前留着该标记)
# 已发布的版本或已存在的 Release 会跳过, 因此补推已手动发布版本的 tag 或重跑失败的运行都安全
name: Release
run-name: Release ${{ github.ref_name }}

on:
    push:
        tags: ["*@*"]

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            actions: read # 查询 CI 结果
            contents: read
        outputs:
            name: ${{ steps.pkg.outputs.name }}
            version: ${{ steps.pkg.outputs.version }}
            dist_tag: ${{ steps.pkg.outputs.dist_tag }}
            prerelease: ${{ steps.pkg.outputs.prerelease }}
            kind: ${{ steps.pkg.outputs.kind }}
            ext_id: ${{ steps.pkg.outputs.ext_id }}
        env:
            TAG: ${{ github.ref_name }}
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            # 从 tag 解析包名与版本, 与 package.json 的 version 不一致时直接失败
            - name: Resolve package
              id: pkg
              run: |
                  name="${TAG%@*}"
                  version="${TAG##*@}"
                  if [ ! -f "packages/$name/package.json" ]; then
                    echo "::error::packages/$name 不存在"
                    exit 1
                  fi
                  if [ "$(node -p "require('./packages/$name/package.json').private === true")" = true ]; then
                    echo "::error::packages/$name 是 private 包, 不发布"
                    exit 1
                  fi
                  actual="$(node -p "require('./packages/$name/package.json').version")"
                  if [ "$actual" != "$version" ]; then
                    echo "::error::tag 版本 $version 与 packages/$name/package.json 的 $actual 不一致"
                    exit 1
                  fi
                  # 带预发布后缀(例: 0.0.5-beta.1)的版本发布到 next, 不覆盖 latest
                  case "$version" in
                    *-*) dist_tag=next; prerelease=true ;;
                    *) dist_tag=latest; prerelease=false ;;
                  esac
                  # VS Code 插件: 市场不接受带 - 后缀的版本号, 预发布版改用 vsce 的 --pre-release(见包内 scripts/package.mjs)
                  kind=npm
                  ext_id=
                  if [ "$(node -p "Boolean(require('./packages/$name/package.json').engines?.vscode)")" = true ]; then
                    kind=vscode
                    ext_id="$(node -p "const p = require('./packages/$name/package.json'); p.publisher + '.' + p.name")"
                    if [ "$prerelease" = true ]; then
                      echo "::error::VS Code 市场不支持带 - 后缀的版本号 $version"
                      exit 1
                    fi
                  fi
                  {
                    echo "name=$name"
                    echo "version=$version"
                    echo "dist_tag=$dist_tag"
                    echo "prerelease=$prerelease"
                    echo "kind=$kind"
                    echo "ext_id=$ext_id"
                  } >> "$GITHUB_OUTPUT"

            # 发布前必须处理的事项用 RELEASE-BLOCKER 标记写在包内文件里, 标记还在就不发布
            - name: Check release blockers
              run: |
                  if grep -rIn --exclude-dir=node_modules RELEASE-BLOCKER "packages/${{ steps.pkg.outputs.name }}"; then
                    echo "::error::packages/${{ steps.pkg.outputs.name }} 中仍有 RELEASE-BLOCKER 标记, 处理后再发布"
                    exit 1
                  fi

            # 不重复跑 lint 与单测: 等待同一提交在 main 上的 CI 结束, 通过才发布
            - name: Wait for CI
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  started=$SECONDS
                  while :; do
                    state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" \
                      --jq '.workflow_runs[0] | if . == null then "missing" else "\(.status)/\(.conclusion // "")" end')"
                    case "$state" in
                      completed/success) echo "CI 已通过"; exit 0 ;;
                      completed/*) echo "::error::CI 未通过($state), 不发布"; exit 1 ;;
                      missing)
                        # 与 main 同时推送时 CI 可能稍后才出现; 5 分钟仍没有说明该提交没推到 main
                        if [ $((SECONDS - started)) -gt 300 ]; then
                          echo "::error::提交 $GITHUB_SHA 没有 CI 运行记录, 先把它推送到 main"
                          exit 1
                        fi ;;
                    esac
                    echo "CI 状态: $state, 30 秒后重试"
                    sleep 30
                  done

            - uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  package-manager-cache: false

            # 有 build 脚本的包(例如产物在 dist/ 的 TypeScript 包)先安装依赖并构建; 打包跳过 prepack 等生命周期脚本
            # files 中声明了 npm-shrinkwrap.json 的包, 打包前由仓库脚本从 lockfile 生成(不执行依赖代码), 并确认已打进包
            - name: Build and pack
              if: steps.pkg.outputs.kind == 'npm'
              working-directory: packages/${{ steps.pkg.outputs.name }}
              run: |
                  if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
                    npm ci
                    npm run build
                  fi
                  shrinkwrap=false
                  if node -e "process.exit((require('./package.json').files || []).includes('npm-shrinkwrap.json') ? 0 : 1)"; then
                    shrinkwrap=true
                    node ../../scripts/shrinkwrap.mjs .
                  fi
                  mkdir -p "$RUNNER_TEMP/pack"
                  npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pack"
                  if [ "$shrinkwrap" = true ] && ! tar tzf "$RUNNER_TEMP"/pack/*.tgz | grep -qx 'package/npm-shrinkwrap.json'; then
                    echo "::error::package.json 的 files 声明了 npm-shrinkwrap.json, 但包里没有"
                    exit 1
                  fi
                  ls -l "$RUNNER_TEMP/pack"

            # VS Code 插件: package 脚本做生产构建并按允许清单断言 vsix 内容; check 校验图标产物, 清单占位符与本地化
            - name: Package extension
              if: steps.pkg.outputs.kind == 'vscode'
              working-directory: packages/${{ steps.pkg.outputs.name }}
              env:
                  NAME: ${{ steps.pkg.outputs.name }}
                  VERSION: ${{ steps.pkg.outputs.version }}
              run: |
                  npm ci
                  npm run check
                  npm run package
                  mkdir -p "$RUNNER_TEMP/pack"
                  cp "artifacts/$(node -p "require('./package.json').name")-$VERSION.vsix" "$RUNNER_TEMP/pack/"
                  ls -l "$RUNNER_TEMP/pack"

            - uses: actions/upload-artifact@v7
              with:
                  name: package
                  path: |
                      ${{ runner.temp }}/pack/*.tgz
                      ${{ runner.temp }}/pack/*.vsix
                  if-no-files-found: error
                  retention-days: 7

    publish:
        needs: build
        if: needs.build.outputs.kind == 'npm'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            id-token: write # npm Trusted Publishing
        env:
            NAME: ${{ needs.build.outputs.name }}
            VERSION: ${{ needs.build.outputs.version }}
        steps:
            - uses: actions/download-artifact@v8
              with:
                  name: package
                  path: pack
            # Trusted Publishing 需要 npm >= 11.5.1 与 Node >= 22.14.0
            - uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false
            - run: npm i -g npm@11
            # 只发布 build 产出的 tarball, 不安装依赖也不执行任何脚本
            - name: Publish
              run: |
                  if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
                    echo "$NAME@$VERSION 已在 npm 上, 跳过发布"
                    exit 0
                  fi
                  # 必须带 ./: 写成 pack/x.tgz 会被 npm 当成 GitHub 简写 <用户>/<仓库> 去 git 拉取
                  npm publish ./pack/*.tgz --provenance --access public --tag "${{ needs.build.outputs.dist_tag }}"

    # 只发布 build 产出的 vsix, 不安装依赖也不执行任何脚本; vsce 与 ovsx 钉死版本, 升级时改这里
    # 两个市场都先查询是否已有该版本, 已有就跳过: 两个工具对已存在的版本都直接报错, 不查就无法重跑只失败了一半的发布
    marketplace:
        needs: build
        if: needs.build.outputs.kind == 'vscode'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            EXT_ID: ${{ needs.build.outputs.ext_id }}
            VERSION: ${{ needs.build.outputs.version }}
            VSCE_PAT: ${{ secrets.VSCE_PAT }}
        steps:
            - uses: actions/download-artifact@v8
              with:
                  name: package
                  path: pack
            - uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  package-manager-cache: false
            # 扩展从未发布过时 vsce show 失败, 按未发布处理
            - name: Publish to VS Code Marketplace
              run: |
                  if [ -z "$VSCE_PAT" ]; then
                    echo "::error::仓库 Secrets 缺少 VSCE_PAT, 无法发布到 VS Code Marketplace"
                    exit 1
                  fi
                  versions="$(npx --yes @vscode/vsce@4.0.0 show "$EXT_ID" --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).versions.map(v=>v.version).join("\n"))}catch{}})' || true)"
                  if printf '%s\n' "$versions" | grep -qxF "$VERSION"; then
                    echo "$EXT_ID@$VERSION 已在 Marketplace 上, 跳过发布"
                    exit 0
                  fi
                  npx --yes @vscode/vsce@4.0.0 publish --packagePath pack/*.vsix

    # Open VSX(VSCodium, Cursor 等使用的市场)可选: 没配 OVSX_PAT 时跳过; 只有 404 按未发布处理, 查询失败让 job 失败
    open-vsx:
        needs: build
        if: needs.build.outputs.kind == 'vscode'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            EXT_ID: ${{ needs.build.outputs.ext_id }}
            VERSION: ${{ needs.build.outputs.version }}
            OVSX_PAT: ${{ secrets.OVSX_PAT }}
        steps:
            - uses: actions/download-artifact@v8
              with:
                  name: package
                  path: pack
            - uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  package-manager-cache: false
            - name: Publish to Open VSX
              run: |
                  if [ -z "$OVSX_PAT" ]; then
                    echo "::notice::没有配置 OVSX_PAT, 跳过 Open VSX"
                    exit 0
                  fi
                  path="${EXT_ID/./\/}"
                  if ! status="$(curl -sS --retry 3 -o /dev/null -w '%{http_code}' "https://open-vsx.org/api/$path/$VERSION")"; then
                    echo "::error::查询 Open VSX 失败, 无法判断 $EXT_ID@$VERSION 是否已发布"
                    exit 1
                  fi
                  case "$status" in
                    200) echo "$EXT_ID@$VERSION 已在 Open VSX 上, 跳过发布"; exit 0 ;;
                    404) ;;
                    *) echo "::error::查询 Open VSX 返回 HTTP $status"; exit 1 ;;
                  esac
                  npx --yes ovsx@1.3.0 publish pack/*.vsix

    # npm 包只等 publish, VS Code 插件只等两个市场; 不相关的 job 是 skipped, 不能让它们拖住 Release
    release:
        needs: [build, publish, marketplace, open-vsx]
        if: ${{ !cancelled() && needs.build.result == 'success' && !contains(needs.*.result, 'failure') }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write # 创建 GitHub Release
        env:
            TAG: ${{ github.ref_name }}
            NAME: ${{ needs.build.outputs.name }}
            VERSION: ${{ needs.build.outputs.version }}
            PRERELEASE: ${{ needs.build.outputs.prerelease }}
            KIND: ${{ needs.build.outputs.kind }}
            GH_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
                  sparse-checkout: packages/${{ needs.build.outputs.name }}/CHANGELOG.md
                  sparse-checkout-cone-mode: false
            - uses: actions/download-artifact@v8
              if: needs.build.outputs.kind == 'vscode'
              with:
                  name: package
                  path: pack
            # 取 CHANGELOG 中「## <版本>」或「## v<版本>」到下一个二级标题之间的内容作为 Release 说明; VS Code 插件附上 vsix
            - name: GitHub Release
              run: |
                  if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                    echo "Release $TAG 已存在, 跳过"
                    exit 0
                  fi
                  awk -v v="$VERSION" '
                    /^## / { if (found) exit; if ($0 == "## " v || index($0, "## " v " ") == 1 || $0 == "## v" v || index($0, "## v" v " ") == 1) { found = 1; next } }
                    found { print }
                  ' "packages/$NAME/CHANGELOG.md" > release-notes.md
                  if [ ! -s release-notes.md ]; then
                    echo "CHANGELOG 中没有 $VERSION 的条目" > release-notes.md
                  fi
                  flags=()
                  if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
                  files=()
                  if [ "$KIND" = vscode ]; then files=(pack/*.vsix); fi
                  gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file release-notes.md --verify-tag "${flags[@]}"
